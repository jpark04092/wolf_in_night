name: Build and Deploy to release branch

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web PWA (Vite)
        env:
          GITHUB_SHA: ${{ github.sha }}
          VITE_GIT_COMMIT_HASH: ${{ github.sha }}
        run: npm run build

      - name: Deploy dist to release branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cp install.sh dist/install.sh
          cp update.sh dist/update.sh
          chmod +x dist/install.sh dist/update.sh

          cd dist
          git init
          git checkout -b release
          git add -A
          git commit -m "deploy: automated build for NAS (${{ github.sha }}) [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" release
          echo "Successfully published dist files to release branch."

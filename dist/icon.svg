<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="wolfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  
  <!-- Outer aura -->
  <circle cx="256" cy="220" r="180" fill="url(#moonGlow)"/>
  <!-- Full Moon -->
  <circle cx="256" cy="220" r="110" fill="#fef08a"/>
  <circle cx="230" cy="180" r="25" fill="#fde047" opacity="0.3"/>
  <circle cx="280" cy="240" r="35" fill="#fde047" opacity="0.25"/>
  <circle cx="210" cy="235" r="18" fill="#fde047" opacity="0.2"/>

  <!-- Mountain / Cliff Silhouette -->
  <path d="M0,512 L140,360 L240,430 L380,330 L512,470 L512,512 Z" fill="#0f172a"/>
  
  <!-- Howling Wolf Silhouette -->
  <g transform="translate(190, 160) scale(0.65)">
    <path d="M70,160 C75,140 85,115 105,95 C125,75 140,65 160,35 C165,25 170,10 178,2 C180,-1 183,2 182,7 C180,18 174,38 185,42 C196,46 215,35 220,40 C223,43 218,52 210,58 C200,65 195,75 198,90 C202,110 215,130 225,160 C235,190 230,225 210,255 C190,285 170,300 150,320 C130,340 100,350 70,350 C50,330 40,290 45,260 C50,230 65,185 70,160 Z" fill="#020617"/>
    <!-- Red glowing eye -->
    <ellipse cx="165" cy="52" rx="4" ry="3" fill="#ef4444"/>
  </g>

  <!-- Stars -->
  <circle cx="90" cy="90" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="410" cy="110" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="360" cy="70" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="130" cy="180" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="430" cy="220" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="80" cy="270" r="2" fill="#ffffff" opacity="0.5"/>
</svg>
